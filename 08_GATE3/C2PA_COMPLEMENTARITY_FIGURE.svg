<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>

  <text x="380" y="30" text-anchor="middle" font-size="16" font-weight="bold">Complementary layers: C2PA vs Summary Codec</text>

  <!-- Left: C2PA -->
  <rect x="30" y="55" width="300" height="230" rx="10" fill="#eef3fb" stroke="#3b6bb5" stroke-width="1.5"/>
  <text x="180" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#1f4e8c">C2PA / Content Credentials</text>
  <text x="48" y="115" font-size="12" fill="#222">• authorship / attribution claims</text>
  <text x="48" y="140" font-size="12" fill="#222">• provenance events (create, edit)</text>
  <text x="48" y="165" font-size="12" fill="#222">• content history / ingredients</text>
  <text x="48" y="190" font-size="12" fill="#222">• authenticity, modification chain</text>
  <text x="48" y="215" font-size="12" fill="#222">• industry trust infrastructure</text>
  <text x="48" y="252" font-size="11" font-style="italic" fill="#444">question: “who made this file and</text>
  <text x="48" y="268" font-size="11" font-style="italic" fill="#444">what happened to it?”</text>

  <!-- Right: Summary Codec -->
  <rect x="430" y="55" width="300" height="230" rx="10" fill="#eef7ee" stroke="#3d8a3d" stroke-width="1.5"/>
  <text x="580" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#256b25">Summary Codec</text>
  <text x="448" y="115" font-size="12" fill="#222">• declared recoverability level (L0–L4)</text>
  <text x="448" y="140" font-size="12" fill="#222">• level-specific mandatory validation</text>
  <text x="448" y="165" font-size="12" fill="#222">• payload↔visible semantic consistency</text>
  <text x="448" y="190" font-size="12" fill="#222">• secondary-analysis guarantees (L3)</text>
  <text x="448" y="215" font-size="12" fill="#222">• canonical-data recovery (L4)</text>
  <text x="448" y="252" font-size="11" font-style="italic" fill="#444">question: “what can you recompute,</text>
  <text x="448" y="268" font-size="11" font-style="italic" fill="#444">and is that still true?”</text>

  <!-- Shared strip -->
  <rect x="245" y="120" width="270" height="140" rx="10" fill="#fdf6e8" stroke="#b5892b" stroke-width="1.5"/>
  <text x="380" y="145" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#7a5c12">shared / integration layer</text>
  <text x="265" y="170" font-size="11.5" fill="#222">signatures (Ed25519 / CA certs)</text>
  <text x="265" y="192" font-size="11.5" fill="#222">signed manifests</text>
  <text x="265" y="214" font-size="11.5" fill="#222">object_hash ↔ C2PA ingredient binding</text>
  <text x="265" y="236" font-size="11.5" fill="#222">publisher / institution attestation</text>

  <!-- connectors -->
  <line x1="330" y1="170" x2="245" y2="170" stroke="#999" stroke-width="1.2"/>
  <line x1="430" y1="170" x2="515" y2="170" stroke="#999" stroke-width="1.2"/>

  <text x="380" y="315" text-anchor="middle" font-size="11" fill="#555">one file, two orthogonal guarantees: identity/history (C2PA) + recoverability semantics (Summary Codec)</text>
</svg>
