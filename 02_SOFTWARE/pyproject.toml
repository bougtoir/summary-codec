[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "summarycodec"
version = "0.1.0"
description = "Format-independent recoverability framework for scientific figures and tables"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "pillow",
    "tifffile",
    "cryptography",
]

[project.scripts]
summarycodec = "summarycodec.cli:main"

[tool.setuptools.packages.find]
include = ["summarycodec*"]
